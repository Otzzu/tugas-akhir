# Production stack: FastAPI app + Celery worker + Redis (broker) + PostgreSQL
# (pgvector) + MinIO (object storage) + Adminer (DB UI).
# Build context is the repo root so the image can build the gnn_vuln wheel.
#   docker compose -f API/docker-compose.yml up --build
#
# UIs:  API docs http://localhost:8000/docs · MinIO console http://localhost:9001
#       Adminer (DB browser) http://localhost:8080

# Shared env for the API server and the Celery worker (same image + config).
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://vuln:vuln@db:5432/vulndb
  JOERN_CLI: /opt/joern/joern-cli
  GNN_VULN_ROOT: /app             # library resolves data/checkpoints/logs under here
  API_DEVICE: cpu                 # set to cuda + use a CUDA base image for GPU
  API_CORS_ORIGINS: "*"
  # object storage — CPG blobs + dataset bundles go to MinIO, not the DB
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET_GRAPHS: graphs
  S3_BUCKET_DATASETS: datasets
  S3_BUCKET_CHECKPOINTS: checkpoints
  # async jobs (Celery) — Redis broker + result backend
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1

services:
  db:
    # pgvector image = stock Postgres 16 + the `vector` extension, ready for
    # similarity search / drift detection over stored function embeddings.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vuln
      POSTGRES_PASSWORD: vuln
      POSTGRES_DB: vulndb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuln -d vulndb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "8080:8080"     # DB browser UI (server=db, user/pass/db=vuln/vuln/vulndb)
    depends_on:
      - db

  api:
    build:
      context: ..
      dockerfile: API/Dockerfile
      args:
        # optional: pre-pruned joern (208MB) instead of the 1.7GB official zip.
        # export JOERN_SLIM_GDRIVE_ID=<file-id>  (needs the Drive file shared publicly)
        JOERN_SLIM_GDRIVE_ID: ${JOERN_SLIM_GDRIVE_ID:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      # Own storage, NOT the research repo. Object storage is the source of truth: checkpoints
      # and dataset bundles are pulled from MinIO into these volumes on demand. Binding the host
      # repo instead would let the service overwrite research artifacts, and would survive
      # `down -v` — a stale .materialized marker then hides a re-seeded bundle.
      - appckpt:/app/checkpoints
      - appdata:/app/data
      - jobsdata:/app/API/jobs       # shared with the worker — API writes input, worker reads it
    # a running container is not a ready service: uvicorn still has to bind and the lifespan has
    # to init+seed the DB. `up -d --wait` blocks on this, so a test never races the boot.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Celery workers — heavy jobs off the web server, split by per-task queue.
  #   worker-gpu  -Q relearn,ingest  → GPU-bound tasks, ONE at a time (concurrency=1) so they
  #                                    serialize on a single GPU (no OOM). GPU reservation +
  #                                    API_DEVICE=cuda are added by docker-compose.gpu.yml.
  #   worker-cpu  -Q merge           → CPU-only .pt merge, parallel (concurrency=2), never
  #                                    blocked by a long train.
  # Same image + volumes as api; only queues / concurrency / device differ.
  worker-gpu:
    build:
      context: ..
      dockerfile: API/Dockerfile
      args:
        # optional: pre-pruned joern (208MB) instead of the 1.7GB official zip.
        # export JOERN_SLIM_GDRIVE_ID=<file-id>  (needs the Drive file shared publicly)
        JOERN_SLIM_GDRIVE_ID: ${JOERN_SLIM_GDRIVE_ID:-}
    command: celery -A API.celery_app worker --loglevel=info -Q relearn,ingest --concurrency=1
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    environment: *app-env
    volumes:
      - appckpt:/app/checkpoints
      - appdata:/app/data
      - jobsdata:/app/API/jobs
    healthcheck: &celery-ready
      # ping THIS node: a worker is only ready once it has imported torch and joined its queue
      test: ["CMD-SHELL", "celery -A API.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  worker-cpu:
    build:
      context: ..
      dockerfile: API/Dockerfile
      args:
        # optional: pre-pruned joern (208MB) instead of the 1.7GB official zip.
        # export JOERN_SLIM_GDRIVE_ID=<file-id>  (needs the Drive file shared publicly)
        JOERN_SLIM_GDRIVE_ID: ${JOERN_SLIM_GDRIVE_ID:-}
    command: celery -A API.celery_app worker --loglevel=info -Q merge --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    environment: *app-env
    volumes:
      - appckpt:/app/checkpoints
      - appdata:/app/data
      - jobsdata:/app/API/jobs
    healthcheck: *celery-ready

volumes:
  pgdata:
  miniodata:
  jobsdata:
  appdata:      # datasets materialized from MinIO
  appckpt:      # checkpoints materialized from MinIO
