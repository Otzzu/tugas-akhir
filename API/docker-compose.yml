# Production stack: FastAPI app + PostgreSQL.
# Build context is the repo root so the image can COPY src/ configs/ checkpoints/.
#   docker compose -f API/docker-compose.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vuln
      POSTGRES_PASSWORD: vuln
      POSTGRES_DB: vulndb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vuln -d vulndb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: API/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://vuln:vuln@db:5432/vulndb
      JOERN_CLI: /opt/joern/joern-cli
      API_DEVICE: cpu                 # set to cuda + use a CUDA base image for GPU
      API_CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    volumes:
      # mount trained checkpoints + datasets from the host (don't bake large artifacts into the image)
      - ../checkpoints:/app/checkpoints
      - ../data:/app/data

volumes:
  pgdata:
