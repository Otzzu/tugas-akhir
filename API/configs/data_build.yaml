# Self-contained dataset-build (featurization) config — INDEPENDENT of any
# training config. Holds ONLY what the .pt builder reads: the node/func embedder
# (how a dataset is featurized) plus neutral data defaults. Training
# hyperparameters (loss, lr, epochs, sampler, class weights, early-stop) live in
# the relearn/training config, never here. The /datasets endpoint overlays the
# per-request data overrides (mode, max_nodes, sampling) on top of this.
data:
  mode: multiclass
  max_nodes: 2500
  # No class filtering, no per-class cap: the rows belong to the caller, so every class in
  # them is built. top_cwe / max_per_class / the MITRE-OWASP presets shape a benchmark and
  # live in the research configs, not here.
  storage: inmemory

# Embedder = featurization. Must match the models the dataset will be used with
# (project standard: UniXcoder node + function tokens, 1024-token window).
model:
  pretrained_lm: microsoft/unixcoder-base-nine
  func_lm: microsoft/unixcoder-base-nine
  func_lm_source: raw
  add_func_tokens: true
  func_max_length: 1024

train:
  device: cpu
