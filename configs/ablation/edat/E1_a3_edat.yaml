# EDAT E1 — A3 live-LM base + Embedding-layer Driven Adversarial Training.
# Identifier-only FGSM-sign PGD on the live UniXcoder word_embeddings (matches
# src/EDAT/EDAT-MLT reference multi_task_pgd.py). Single-variable change vs A3:
# add use_edat=true. Baseline for comparison = A3 (already run, no EDAT).
#
# NOTE: not an N-series run — EDAT needs live_lm=func (perturbs the live LM
# embeddings), so it is a live-LM model, not the gnn_only track. N62 is already
# the gnn_only cRT+LA config, so this lives under configs/ablation/edat/.
#
# EDAT requires: live LM trainable (lm_lr set so word_embeddings have grad for PGD),
# compile_model=false, no sliding-window chunking, no per-line LM. A3 satisfies all.
# Cost: ~doubles LM forward passes -> +40-60% slower than A3. Cloud only.
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/edat/E1_a3_edat.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: lm
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: false

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  lm_lr: 0.00001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.0001
  patience: 25
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 2.0
  epoch_adaptive_weights: true
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 1
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
  use_edat: true
  edat_epsilon: 0.02
  edat_alpha: 0.01
  edat_steps: 3
