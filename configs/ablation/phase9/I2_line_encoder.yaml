# Phase 9 — I2: Line-level encoder, frozen func_lm (live_lm=line, freeze_func_lm=true)
# Base: I1 = H1 = G2 (hidden_dim=768, meanmax, localization=both, no sliding window)
# Varies: live_lm=line + freeze_func_lm=true.
#   Each source line encoded independently through frozen UniXcoder → [CLS] per line.
#   _LineLevelEncoder (2-layer cross-line transformer, TRAINABLE) contextualizes across lines.
#   Classification = meanmax pool of line_encoder output [B, 768].
#   Localization = per-line encoder output scattered back to token positions.
#   func_lm weights frozen (no lm_lr group); only GNN + line_encoder + heads train.
# Same .pt build as I1/H1/G2: node-unixcoder_func-unixcoder, func_max_length=1024.
#   func_max_length kept at 1024 for _ds_name() compatibility; precompute uses raw_func
#   (full source text stored in .pt) so ALL lines are encoded (up to 1022 tokens each).
# use_flash_attention=true: FA2 enabled; per-line seqs are short but modern FA2 handles them.
# compile_model=false: _LineLevelEncoder uses to_dense_batch (data-dependent shape) which
#   causes GuardOnDataDependentSymNode; scatter_lines_to_tokens uses boolean masks → nonzero.
#   Disabled for correctness; re-enable only after verifying dynamo guards.
#
# .pt build: configs/data/megavul_multiclass_top25_node-unixcoder_func-unixcoder.yaml
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/phase9/I2_line_encoder.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  live_lm: line
  freeze_func_lm: true
  precompute_line_cls: true
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: meanmax
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: false

train:
  seed: 42
  epochs: 100
  batch_size: 16
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
