# Phase 9 — I4: Line-level encoder, frozen func_lm, context window ±5 lines
# Base: I1 = H1 = G2 (hidden_dim=768, meanmax, localization=both, no sliding window)
# Varies from I2: each line encoded with ±5 neighbouring lines as context.
#   Input per line: [CLS] line_(i-5) ... line_i ... line_(i+5) [SEP] (joined by \n)
#   Per-line CLS now sees token-level cross-line interactions within ±5 lines.
#   UniXcoder 12-layer attention over all context tokens → richer CLS than I2.
#   _LineLevelEncoder (2-layer cross-line transformer) provides global cross-line context.
#   Classification = meanmax pool of line_encoder output [B, 768].
#   Localization = per-line encoder output scattered back to token positions.
#
# Precompute uses raw_func (full source text), all lines encoded (no global truncation).
# MAX_CONTENT=1022 per line-with-context input (UniXcoder max 1024 incl. CLS+SEP).
# NOTE: context window precompute overwrites func_line_cls in .pt files.
#       Run I4 on a fresh pull or after I2 is finished — not in parallel on same .pt.
#
# .pt build: configs/data/megavul_multiclass_top25_node-unixcoder_func-unixcoder_ml5120.yaml
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/phase9/I4_line_ctx5.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 5120
  live_lm: line
  freeze_func_lm: true
  precompute_line_cls: true
  line_context_lines: 5
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: meanmax
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: false

train:
  seed: 42
  epochs: 100
  batch_size: 16
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
