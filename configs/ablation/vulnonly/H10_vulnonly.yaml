# H10 on the VULN-ONLY dataset — 25 CWE classes, NO benign. For a FAIR head-to-head
# with LOSVER (which classifies CWE type given a vulnerable function, vuln-only 25-class).
# Identical to H10 (Phase 8 best LM, Test F1 0.534 on 26-class) EXCEPT:
#   data.ds_name_suffix: _vulnonly  (loads the no-benign .pt)
#   model.num_classes: 25
# Matches LOSVER's task at the TRAINING-objective level (both trained vuln-only 25-class),
# not just eval — see [[project_paper_baselines]] fairness note.
#
# Dataset: build with scripts/build_vuln_only_subset.py from the ml5120 base (CPU, reuses
# graphs, no Joern/re-embed) -> lm_dataset_..._ml5120_..._s1600r42_vulnonly.
# Run (cloud, Linux):
#   ./scripts/train_cloud.sh --skip --config configs/ablation/vulnonly/H10_vulnonly.yaml \
#     --dataset lm_dataset_megavul_multiclass_unixcoder-base_ft_ml5120_f40f2e964_s1600r42_vulnonly

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0                  # already filtered in the .pt — don't re-filter
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy
  ds_name_suffix: _vulnonly   # loads the no-benign .pt

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 5120
  func_chunk_size: 1024
  func_chunk_stride: 1024
  window_attn_pool: false
  window_mixer: true
  window_mixer_max: 6
  cross_window_attn: false
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: meanmax
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 25
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: false

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  lm_lr: 0.00001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 1
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
