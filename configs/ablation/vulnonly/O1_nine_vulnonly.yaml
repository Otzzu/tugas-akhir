# O1 (N48 GNN block + H10 LM aggregation) on VULN-ONLY 25-class — fair LOSVER head-to-head.
# Identical to O1_join_n48gnn_h10lm.yaml EXCEPT ds_name_suffix _vulnonly + num_classes 25.
# Uses the SAME ml5120 vuln-only .pt as H10_vulnonly (build once, reuse).
# Run (cloud, Linux):
#   ./scripts/train_cloud.sh --skip --config configs/ablation/vulnonly/O1_vulnonly.yaml \
#     --dataset lm_dataset_megavul_multiclass_unixcoder-base_ft_ml5120_f40f2e964_s1600r42_vulnonly

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy
  ds_name_suffix: _vulnonly

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base-nine
  func_lm: microsoft/unixcoder-base-nine
  add_func_tokens: true
  func_max_length: 5120
  func_chunk_size: 1024
  func_chunk_stride: 1024
  window_attn_pool: false
  window_mixer: true
  window_mixer_max: 6
  cross_window_attn: false
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: jknet
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 25
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  lm_lr: 0.00001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 1
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0      # single-process loading — avoids concurrent-read FS race on lazy .pt
  prefetch_factor: 2
