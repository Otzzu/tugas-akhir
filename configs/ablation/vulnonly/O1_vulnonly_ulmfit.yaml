# O1 vuln-only + ULMFiT gradual unfreezing (best Phase 12 method = M2, F1 0.532 vs base 0.520).
# Identical to O1_vulnonly.yaml EXCEPT train.lm_unfreeze_schedule added.
# Gradual unfreeze schedule (epoch, trainable top-N LM layers):
#   epoch 1-2: 0 (all LM frozen, train head + GNN only)
#   epoch 3-5: top 4 LM layers
#   epoch 6-9: top 8 LM layers
#   epoch 10+: all LM layers (incl embeddings)
# Same ml5120 vuln-only .pt as O1_vulnonly.
# Run (cloud, Linux):
#   ./scripts/train_cloud.sh --skip --clean-every 1 \
#     --config configs/ablation/vulnonly/O1_vulnonly_ulmfit.yaml \
#     --dataset lm_dataset_megavul_multiclass_unixcoder-base_ft_ml5120_f40f2e964_s1600r42_vulnonly

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy
  ds_name_suffix: _vulnonly

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 5120
  func_chunk_size: 1024
  func_chunk_stride: 1024
  window_attn_pool: false
  window_mixer: true
  window_mixer_max: 6
  cross_window_attn: false
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: jknet
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 25
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  lm_lr: 0.00001
  lm_unfreeze_schedule:
    - [1, 0]
    - [3, 4]
    - [6, 8]
    - [10, "all"]
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 1
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0      # single-process loading — avoids concurrent-read FS race on lazy .pt
  prefetch_factor: 2
