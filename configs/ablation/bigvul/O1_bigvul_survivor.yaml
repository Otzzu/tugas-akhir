# O1 on LIVABLE's Big-Vul SURVIVORS — fair head-to-head vs LIVABLE-on-Big-Vul (51.7 macro-F1).
# Same functions (the 5841 joern survivors), same EXACT split (split_file = LIVABLE's
# used_{train,val,test}.json mapped to parquet_id), same 31 CWE classes (incl Nonetype).
#
# Data prep (local, Windows):  scripts/prepare_bigvul_survivor.ps1
#   -> adapter (survivors.parquet + cwe_vocab.json + split_file.json) -> joern CPG -> this trains.
# split_file overrides get_splits; max_per_class:0 + no class filters keep the FULL survivor set
# so the test split == LIVABLE's exact 602 test funcs.

data:
  source: bigvul_survivor
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0                 # use all 31 in the pre-seeded cwe_vocab (no narrowing)
  filter_top25_dangerous: false
  filter_owasp: false
  max_per_class: 0           # NO subsampling — keep every survivor so the split matches LIVABLE
  resample_seed: 42
  storage: lazy
  split_file: data/datasets/bigvul_survivor/split_file.json

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base-nine
  add_func_tokens: true
  func_max_length: 5120
  func_chunk_size: 1024
  func_chunk_stride: 1024
  window_attn_pool: false
  window_mixer: true
  window_mixer_max: 6
  cross_window_attn: false
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: jknet
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 31            # LIVABLE's 31 CWE types (top-30 + Nonetype)
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  lm_lr: 0.00001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 1
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
