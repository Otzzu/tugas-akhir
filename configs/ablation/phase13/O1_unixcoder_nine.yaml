# Phase 13 — O1: join best GNN-only (N48) + best Phase 8 LM aggregation (H10).
# Backbone = H10 (UniXcoder live LM, sliding window stride=1024 non-overlap,
# WindowMixerPool, localization=both concat, hidden_dim=768) with its graph_pool
# (meanmax) + GNN block (resnet/relu) swapped for N48's winners:
#   graph_pool: jknet, gnn_block_style: gnn_plus, gnn_activation: elu,
#   gnn_use_ffn: true, gnn_ffn_expansion: 2, use_skip: true.
# N48 = best GNN-only (Test F1 0.525). H10 = best Phase 8 (Test F1 0.534, 26 ep).
# Hypothesis: GNN-side architectural wins (multi-scale JK-Net pool + gnn_plus
# block) stack with the LM-side aggregation winner -> F1 > 0.534.
#
# Follow-up (phase 2, after this trains): cRT (Kang 2020) on this checkpoint —
# mirrors N53 (cRT on N48) — freeze backbone, reinit+retrain func_head with
# class-balanced sampler.
#
# .pt build: configs/data/megavul_multiclass_top25_node-unixcoder_func-unixcoder_ml5120.yaml
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/phase13/O1_join_n48gnn_h10lm.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base-nine
  func_lm: microsoft/unixcoder-base-nine
  add_func_tokens: true
  func_max_length: 5120
  func_chunk_size: 1024
  func_chunk_stride: 1024
  window_attn_pool: false
  window_mixer: true
  window_mixer_max: 6
  cross_window_attn: false
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: jknet
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  lm_lr: 0.00001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 1
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
