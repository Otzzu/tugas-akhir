# Phase Q — Q2: frozen linear probe on the node-masked-JEPA encoder (Q0).
# Identical to Q1, EXCEPT the GNN encoder is FROZEN (kept eval) and only the linear
# func_head trains. This is the canonical JEPA SSL-quality measure (Graph-JEPA, I-JEPA:
# freeze the pretrained encoder, fit a linear probe → isolates representation quality,
# no label gradients rewrite the encoder). Expect Test F1 < N48 (0.525) — frozen SSL
# features rarely beat end-to-end supervised; this run is the clean diagnostic, Q1 is
# the F1 contender. Run Q0 first so the EMA checkpoint exists on the pod.
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/jepa/Q2_jepa_frozenprobe_n48.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: jknet
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
  # JEPA frozen linear probe — encoder frozen + eval, only func_head trains.
  gnn_init_checkpoint: checkpoints/jepa/Q0_n48/encoder_ema.pt
  freeze_gnn: true
  crt_reinit_head: true
