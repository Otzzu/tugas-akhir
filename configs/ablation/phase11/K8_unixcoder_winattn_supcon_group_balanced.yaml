# Phase 11 — K8: H4 + SupCon group (intragroup_only) + balanced sampler (8cls×4)
# Combines K5 (group-based positive weighting) + K6 (class-balanced batch sampler).
# intragroup_only=true: only within-group pairs are positives (same-CWE=1.0, same-group=alpha).
# supcon_balanced_sampling: guarantees >=4 samples per chosen class per batch.
# Tests whether group-based SupCon recovers when sparse-pair problem is fixed.
#
# .pt build: configs/data/megavul_multiclass_top25_node-unixcoder_func-unixcoder_ml5120.yaml
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/phase11/K8_unixcoder_winattn_supcon_group_balanced.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 5120
  func_chunk_size: 1024
  func_chunk_stride: 1024
  window_attn_pool: true
  window_attn_hidden: false
  window_center_weight: false
  cross_window_attn: false
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: meanmax
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: false
  supcon_proj_dim: 128
  supcon_proj_hidden: 256
  supcon_proj_dropout: 0.1
  use_supcon: true
  supcon_weight: 0.2
  supcon_self_weight: 0.2
  supcon_temperature: 0.5
  supcon_self_temperature: 0.5
  supcon_alpha: 0.5
  supcon_use_distance_matrix: false
  supcon_intragroup_only: true

train:
  seed: 42
  epochs: 100
  batch_size: 32
  supcon_balanced_sampling: true
  supcon_classes_per_batch: 8
  lr: 0.001
  lm_lr: 0.00001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 1
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
