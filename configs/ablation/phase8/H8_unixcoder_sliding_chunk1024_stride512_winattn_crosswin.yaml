# Phase 8 — H8: H5 + cross-window attention for hidden state refinement
# Base: H5 (stride=512, window_attn_pool=true, 9 windows max).
# Varies from H5: cross_window_attn=true — after overlap-averaging per-token
#   hidden states, a CrossWindowAttn module (cross-attention + residual + LayerNorm)
#   refines each token's hidden by attending over all window CLS vectors.
#   Q = per-token hidden [B, L, 768], K/V = win_cls [B, W, 768]
#   Each token gets to "ask" which window summaries are relevant for its position.
#   Adds global function context to every token's representation before stmt_head.
#   Parameters: MultiheadAttention(768, 4 heads) + LayerNorm(768) ≈ 2.4M params.
#
# .pt build: configs/data/megavul_multiclass_top25_node-unixcoder_func-unixcoder_ml5120.yaml
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/phase8/H8_unixcoder_sliding_chunk1024_stride512_winattn_crosswin.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 5120
  func_chunk_size: 1024
  func_chunk_stride: 512
  window_attn_pool: true
  window_attn_hidden: false
  window_center_weight: false
  cross_window_attn: true
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: meanmax
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: false

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  lm_lr: 0.00001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 1
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
