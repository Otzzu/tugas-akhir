# Phase 8 — H2: G2-based sliding window, chunk=1024, stride=512 (50% overlap)
# H1 baseline: G2 (no sliding, func_max_length=1024, hidden_dim=768, UniXcoder meanmax).
# Extends G2 coverage to P95 MegaVul vuln (4326 tokens) via sliding window.
#
# chunk=1024 = UniXcoder max. stride=512 = 50% overlap.
# Each token appears in ≥2 windows → better boundary coverage vs H3.
# func_max_length=4096 → up to 7 windows per function.
#
# dim breakdown (same as G2):
#   h_graph: 768 (hidden_dim=768)
#   lm_emb:  768 (mean-pool over real tokens per window, averaged across windows)
#   fused:  1536 → GNN 50% / LM 50%
#
# VRAM note: hidden_dim=768 + 7 windows → high VRAM. batch_size=8 + grad_accum=4.
#
# .pt build: configs/data/megavul_multiclass_top25_node-unixcoder_func-unixcoder_ml4096.yaml
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/phase8/H2_unixcoder_sliding_chunk1024_stride512.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 4096
  func_chunk_size: 1024
  func_chunk_stride: 512
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: meanmax
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: false

train:
  seed: 42
  epochs: 100
  batch_size: 4
  lr: 0.001
  lm_lr: 0.00001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 8
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
