# Local GNN-only N13 — N7 + BalO balanced init (Mustafa NeurIPS 2023).
# Base: N7 (current best — meanmax + use_skip + gnn_plus + ELU).
# Varies: gnn_balanced_init true.
# BalO procedure (Mustafa 2023 Procedure 2.6):
#   1. Zero all attention vectors a^l (Xav+ZeroAtt)
#   2. Orthogonal init for lin_l, lin_r (LL-Ortho base)
#   3. Scale first layer row norms to sqrt(beta), beta=2
# Paper showed BalO: Xavier 39.3% → BalO 80.2% Cora at L=10. Smaller boost expected
# for our L=4 setup but should still help.
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N13_a1_l1_gnn_plus_elu_balo.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: meanmax
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_balanced_init: true
  gnn_balanced_init_beta: 2.0

train:
  seed: 42
  epochs: 100
  batch_size: 64
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 1
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
