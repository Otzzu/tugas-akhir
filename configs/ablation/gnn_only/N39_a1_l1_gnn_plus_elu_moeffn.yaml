# Local GNN-only N39 — N15 + Switch-style MoE-FFN (per-node FFN experts).
# Base: N15 (current SOTA — Test F1 0.523, IFA 0.299).
# Varies: gnn_moe_ffn true. Replaces the dense GNN+ FFN sub-block with N expert
#   FFNs; each node routed to top-k via noisy gate (Shazeer 2017 / Switch Fedus 2021).
# Experts: 8, top-k=2, load-balance coef 1e-2. Per-node specialization: vuln nodes
#   route to different FFN experts than benign nodes. More capacity, sparse compute.
# Load-balance aux loss (cv_squared of importance + load) added to total loss.
# Reference: arxiv:2101.03961 (Switch), arxiv:1701.06538 (Shazeer).
# vs N40 (GMoE): N39 routes FFN transform, N40 routes aggregation (hop).
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N39_a1_l1_gnn_plus_elu_moeffn.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: meanmax
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  gnn_moe_ffn: true
  gnn_moe_experts: 8
  gnn_moe_k: 2
  gnn_moe_coef: 0.01
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
