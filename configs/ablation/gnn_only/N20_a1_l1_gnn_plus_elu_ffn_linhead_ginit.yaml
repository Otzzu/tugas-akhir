# Local GNN-only N20 — N15 + G-Init (Kelesis 2024).
# Base: N15 (current SOTA — Test F1 0.523, IFA 0.299).
# Varies: gnn_g_init true. G-Init formula: sigma = sqrt(2 * d_i / fan_in), d_i=2.0.
# = Kaiming-generalized with 2x larger variance to resist oversmoothing.
# Reference: arxiv:2410.23830 "Reducing Oversmoothing through Informed Weight Initialization".
# Paper claim: at L=10+ GCN, G-Init beats Kaiming by 8-25 pp.
# At our L=4, expect smaller boost. Replaces N16's BalO attempt (BalO hurt N15).
# Why G-Init might work where BalO failed:
#   - BalO sets orthogonal weights → washed out by FFN init mismatch.
#   - G-Init scales Gaussian variance → preserves FFN init compatibility.
#   - G-Init targets oversmoothing (relevant to our GAT+FFN+skip stack).
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N20_a1_l1_gnn_plus_elu_ffn_linhead_ginit.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: meanmax
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  gnn_g_init: true
  gnn_g_init_d: 2.0
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
