# Local GNN-only N56 — tau-normalized classifier on N48 (decoupling stage 2).
# Kang et al. 2020 (ICLR), the tau-norm variant: w_i / ||w_i||^tau, bias discarded,
# tau swept on val. ZERO training — post-hoc weight-norm rebalance of N48's existing
# jointly-trained classifier. Independent N48-based tail variant (NOT stacked on cRT).
#
# Model + data sections are IDENTICAL to N48 (required: the N48 checkpoint loads into
# this exact architecture). Only run via scripts/tau_norm.py, which reads model/data
# here and applies the tau search. The train: section is unused by tau_norm.py except
# device, seed, batch_size, checkpoint/results/log dirs.
#
# Run (local — fast, inference only):
#   uv run python scripts/tau_norm.py \
#     --config configs/ablation/gnn_only/N56_a1_l1_tau_norm.yaml \
#     --checkpoint checkpoints/20260606_163818_lmgat_codebert_multiclass/best_lmgat_codebert.pt

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: jknet
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
