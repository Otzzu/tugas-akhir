# Local GNN-only N59 — N48 backbone but PLAIN CE classification (paper-pure stage 1).
# Decoupling stage 1 done the paper's way (Kang 2020): instance-balanced sampling +
# standard cross-entropy, NO loss reweighting. This is N48 with the classification loss
# stripped back to plain CE so it can be the clean backbone for a fully paper-pure cRT
# (N60), instead of inheriting N48's class-weighted + label-smoothed loss.
#
# Diff vs N48 (only the 3 classification-loss flags):
#   use_class_weights      true -> false
#   epoch_adaptive_weights true -> false
#   label_smoothing        0.1  -> 0.0
# Everything else identical to N48: jknet pool, dropout 0.3, mil 0.3, rank 0.2,
# instance-balanced loader (shuffle). MIL + rank kept ON — they are localization losses,
# not classification reweighting, and dropping them destroys localization (cf. N34
# rank=0 -> IFA 9.8). So classification objective = plain CE; localization unchanged.
#
# Purpose: produce a backbone whose representation was learned with plain CE, so N60 can
# run cRT on it for the fully paper-faithful two-stage (instance-bal+plainCE backbone ->
# class-bal+plainCE head). Compare N59 backbone vs N48 (class-weighted) directly, and
# N60 (cRT on N59) vs N53 (cRT on N48).
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N59_a1_l1_jknet_plain_ce.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: jknet
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: false
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: false
  livable_loss: false
  label_smoothing: 0.0
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
