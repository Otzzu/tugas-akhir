# N48 with unixcoder-base-NINE node embeddings (C-aware) — sanity test vs N48 base 0.525.
# Identical to N48_a1_l1_jknet.yaml EXCEPT pretrained_lm/func_lm = unixcoder-base-nine
# (ml1024, same as N48 base — only the node-LM changes). If this beats 0.525, the C-aware LM
# helps and the rebuild is worth it for H10/O1; if flat, stay on base.
#
# Needs the ml1024 nine dataset built first:
#   bash scripts/cloud_process_datasets.sh \
#     configs/data/megavul_multiclass_top25_node-unixcoder-nine_func-unixcoder-nine_ml1024.yaml
# Run:
#   ./scripts/train_cloud.sh --skip --config configs/ablation/gnn_only/N48_nine.yaml \
#     --dataset lm_dataset_megavul_multiclass_unixcoder-base-nine_ft_ml1024_<hash>_s1600r42

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base-nine
  func_lm: microsoft/unixcoder-base-nine
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: jknet
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 1
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
