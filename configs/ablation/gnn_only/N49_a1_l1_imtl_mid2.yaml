# Local GNN-only N49 — N15 + Intermediate-layer MTL (Sogaard & Goldberg ACL 2016).
# group_head taps L2 pool (2-hop, coarser) → group gradient stops at layer 2.
# cwe_head taps L4 pool (4-hop, global) conditioned on group_probs.
# Architectural gradient separation: group and CWE gradients do not compete at h_graph.
# imtl_mid_layer=1 (0-indexed): after 2nd GATv2 layer = 2-hop receptive field.
# group_loss_weight=0.3 matches N46 for fair comparison.
# Hypothesis: gradient separation via intermediate layer unlocks MTL in GNN-only mode.
# Expect: F1 > N46 (0.435); if >= N15 (0.523) confirms gradient conflict was root cause.
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N49_a1_l1_imtl_mid2.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: meanmax
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: imtl
  imtl_mid_layer: 1
  num_groups: 16
  group_loss_weight: 0.3
  binary_loss_weight: 0.0

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
