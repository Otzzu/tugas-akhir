# Local GNN-only N65 — N48 + FLAG adversarial node-feature training (Kong et al. 2020).
# GNN analog of EDAT. EDAT perturbs the live LM's identifier embeddings; FLAG perturbs
# the GNN INPUT node features. Matches reference flag() (src/FLAG attacks.py): single
# step_size for init AND ascent, delta ~ U(-step_size, step_size), M unbounded ascent
# steps delta += step_size*sign(grad) (NO epsilon clamp), param grads accumulated over
# the M perturbed forwards (loss/=M), one optimizer step per batch.
#
# Diff vs N48: add use_flag. The M ascent steps replace grad accumulation (one optimizer
# step per batch). use_amp stays false (FLAG runs the loop in FP32). Everything else = N48.
#
# Note: FLAG is the gnn_only adversarial-regularization slot (EDAT can't run here — no
# live LM to perturb). Same axis as N52 graph-aug, so EV vs cRT is uncertain, but it is
# the faithful gnn_only counterpart of the adversarial-training idea.
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N65_a1_l1_flag.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: jknet
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
  use_flag: true
  flag_step_size: 0.001
  flag_steps: 3
