# Local GNN-only N30 — N15 + dualflow pool for graph readout.
# Base: N15 (current SOTA — Test F1 0.523, IFA 0.299, meanmax pool).
# Varies: graph_pool meanmax → dualflow.
# Dualflow = per-node suspicion gating + mean context:
#   s_i = sigmoid(W_susp · h_i)                        # learned per-node weight
#   h_focal = Σ(s_i · h_i) / Σ(s_i)                    # suspicion-weighted sum (vuln-focused)
#   h_context = mean(h_i)                              # graph-wide average
#   h_graph = h_focal + h_context                      # combined
# Adds 1 Linear(hidden_dim, 1) layer (node_susp). Output dim same as hidden_dim.
# Phase 4 (LM-active) dualflow gave Test F1 0.496, IFA 0.717 — mid-tier.
# For GNN-only N15 base, retest: maybe dualflow's vuln focus helps with linear head.
# Pool ablation: N15=meanmax / N17=mean / N18=add / N19=max / N25=attention / N30=dualflow.
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N30_a1_l1_gnn_plus_elu_ffn_linhead_dualflow.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: dualflow
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 4
  prefetch_factor: 4
