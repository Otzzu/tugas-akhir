# Local GNN-only N10 — N9 + Random Walk Structural Encoding (RWSE) PE.
# Base: N9 (meanmax + use_skip + gnn_plus + ELU + FFN). Full GNN+ 2025 arch with PE.
# PE: random walk landing probs length 32, projected to 28 dim, concat to input.
# Matches GNN+ paper RWSE-32 default (ZINC, PATTERN, Peptides). Our graphs avg 334 nodes
# (larger than molhiv 26, closer to Peptides 150) → longer walks needed.
#
# Precompute step (once per dataset, before first training):
#   PYTHONPATH=src python scripts/precompute_rwse.py \
#     --graphs-dir data/processed/lm_dataset_megavul_multiclass_unixcoder-base_ft_ml1024_f40f2e964_s1600r42_graphs \
#     --walk-length 32
#
# If `data.rwse` attribute missing at runtime, encoder falls back to on-the-fly compute (slow).
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N10_a1_l1_gnn_plus_elu_ffn_pe.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: meanmax
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  gnn_use_pe: true
  gnn_pe_walk_length: 32
  gnn_pe_dim: 28

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
