# Local GNN-only N40 — N15 + GMoE hop experts (Wang et al. NeurIPS 2023).
# Base: N15 (current SOTA — Test F1 0.523, IFA 0.299).
# Varies: gnn_gmoe true. Each GNN layer = GMoEConv: N GATv2 experts where first
#   `experts_1hop` aggregate 1-hop neighbors, rest aggregate 2-hop. Per-node noisy
#   top-k gate selects experts → each node adaptively picks its receptive field.
# Experts: 8 (4 one-hop + 4 two-hop), top-k=2, load-balance coef 1e-2.
# 2-hop edges computed on-the-fly via sparse A@A (self-loops + 1-hop removed).
# Solves depth ablation limit (N22-N24): instead of one fixed L for all nodes,
#   each node chooses 1-hop (local vuln) or 2-hop (data-flow distance) adaptively.
# Reference: arxiv:2304.02806, github.com/VITA-Group/Graph-Mixture-of-Experts.
# vs N39 (MoE-FFN): N40 routes aggregation (receptive field), N39 routes FFN.
# Replaces main GATv2 conv → no separate dense FFN interaction; use_ffn still on
#   (MoE conv feeds the standard GNN+ FFN sub-block).
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N40_a1_l1_gnn_plus_elu_gmoe.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: meanmax
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  gnn_gmoe: true
  gnn_moe_experts: 8
  gnn_moe_experts_1hop: 4
  gnn_moe_k: 2
  gnn_moe_coef: 0.01
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 16
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 4
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
