# Local GNN-only N47 — N15 + GatedGCN backbone (faithful GNN+ GatedGCNLayer).
# Base: N15. Varies: gnn_model gat to gatedgcn. Same recipe family but GatedGCN is
# the self-contained GNN+ layer (5 linears A-E, evolving edge state, normalized
# soft-gate, internal BN act drop residual + FFN) ported 1:1 from GNNPlus repo —
# NOT PyG ResGatedGraphConv. gnn_activation elu kept for fair vs N15.
# GNN+ paper (Luo ICML 2025) tests GCN GIN GatedGCN. GatedGCN best overall there.
# Base: N9 (N7 + FFN — current best loc, IFA 0.372, but worst cls F1 0.391).
# Varies: func_head_type "fat" (FuncHead: Linear→ReLU→Drop→Linear, 2-layer MLP)
#         → "linear" (LinearFuncHead: single Linear). Matches GNN+ 2025 paper:
#         GNN already does heavy lifting (FFN inside each block), classifier
#         should be thin to avoid overfitting on hidden dim.
# Hypothesis: N9's bad cls (0.391) caused by 2-layer MLP overfitting on small
# fused_dim (256). Linear head = fewer params, better regularization, faster.
# Expect: cls F1 ≥ 0.450 (recover to N7 level), loc stays strong (≤ 0.4 IFA).
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N15_a1_l1_gnn_plus_elu_ffn_linhead.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: meanmax
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_model: gatedgcn
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
