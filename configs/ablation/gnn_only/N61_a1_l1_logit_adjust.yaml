# Local GNN-only N61 — N48 + Logit Adjustment loss (Menon et al. 2021).
# Independent N48-based long-tail variant. Swaps N48's class-weighted CE for the
# logit-adjusted softmax CE: loss computed on z_y + tau*log(pi_y), pi = class prior.
# Tail classes (tiny pi -> very negative log pi) get a negative train-time offset,
# forcing a larger logit/margin; at inference the raw logits favour the tail. He et al.
# 2024 empirical study flagged Logit Adjustment (LALoss) as best for recall + F1 balance.
#
# Diff vs N48: imbalance handler swapped, NOT stacked.
#   use_class_weights      true -> false   (LA replaces class weights)
#   epoch_adaptive_weights true -> false
#   logit_adjustment       (new) -> true, tau=1.0
# Kept from N48: jknet pool, dropout 0.3, mil 0.3, rank 0.2, label_smoothing 0.1,
# instance-balanced loader. Full training from scratch.
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/gnn_only/N61_a1_l1_logit_adjust.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: jknet
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: false
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: false
  livable_loss: false
  label_smoothing: 0.1
  logit_adjustment: true
  logit_adjustment_tau: 1.0
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
