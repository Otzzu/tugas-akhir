# Graph-ViT (attention token-mixer) — GNN-only, faithful to He et al. 2023.
# METIS patches -> GATv2 patch-GNN (2 layers, 31-d edges, simplified GNN+ no FFN)
# + U cross-scale mix -> ATTENTION mixer over patches -> pool -> func_head.
# Partition runs ONLINE in forward (metis.online=true) — needs metis+networkx (cloud).
# Reuses the N48 ml1024 megavul .pt (node feats unixcoder, no new build).
# New arch graph_vit, separate from lmgat_codebert. NOTE: diameter analysis says CPGs
# are short-range (diam 5-7) so over-squashing isn't the bottleneck — expect F1-neutral;
# this is a thesis-completeness / negative-result experiment.
#
# Run (cloud): PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/graph_vit/P1_graphvit_attn.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy

model:
  architecture: graph_vit
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  hidden_dim: 256
  num_layers: 2            # patch GNN depth (median 6 nodes/patch -> 2 hops covers it)
  n_patches: 16
  num_hops: 1
  patch_drop_rate: 0.0     # paper uses 0.3 (augmentation); 0.0 for a clean first run
  mixer_type: attention
  mixer_layers: 4
  pe_walk_length: 16
  heads: 4
  edge_dim: 31
  dropout: 0.3
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
