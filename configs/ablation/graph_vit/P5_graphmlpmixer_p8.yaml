# Graph-MLP-Mixer — n_patches=8 (vs P4's 16, P2's paper-default 32).
# Identical to P4 except n_patches 16 -> 8, ds_name_suffix _gvitp16 -> _gvitp8.
# Trend so far: P2 (32) F1 0.343 -> P4 (16) F1 0.357. Smaller patches = more
# nodes/patch on these small CPGs (median diameter 5-7) -> less patch-isolation.
# p8 tests whether the trend continues toward N48 (no patching, F1 0.525).
#
# .pt build: include --graphvit-patch 8 (builds _gvitp8, separate from P1-P4)
# Run (cloud): PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/graph_vit/P5_graphmlpmixer_p8.yaml

data:
  source: megavul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy
  ds_name_suffix: _gvitp8   # loads the offline patched .pt (build_graphvit_patches.py, n_patches must match)

model:
  architecture: graph_vit
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  hidden_dim: 256
  num_layers: 2
  n_patches: 8
  num_hops: 1
  patch_drop_rate: 0.0
  mixer_type: mlp
  mixer_layers: 4
  pe_walk_length: 16
  patch_rw_dim: 8
  heads: 4
  edge_dim: 31
  dropout: 0.3
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  func_head_type: linear

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
