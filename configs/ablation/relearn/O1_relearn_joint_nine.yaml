# O1 hibrida continual UPPER BOUND — Pelatihan ulang gabungan (joint, from scratch).
# ewc.enabled false -> TANPA load checkpoint task-A (inisialisasi acak, from scratch).
# joint.enabled -> loader train = gabungan train task-B + train task-A, uniform shuffle
# (baseline MULTI-TASK Chaudhry et al. 2019). Model block = arsitektur hibrida (live LM ml5120).
#
# Run: RELEARN_NINE=1 RELEARN_ARCH=hybrid RELEARN_METHODS=joint python scripts/run_relearn_experiment.py --seed N

data:
  source: relearn
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy
  ds_name_suffix: ""

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base-nine
  func_lm: microsoft/unixcoder-base-nine
  add_func_tokens: true
  func_max_length: 5120
  func_chunk_size: 1024
  func_chunk_stride: 1024
  window_attn_pool: false
  window_mixer: true
  window_mixer_max: 6
  cross_window_attn: false
  localization_encoder: both
  stmt_both_mode: concat
  graph_pool: jknet
  cross_task_method: none
  hidden_dim: 768
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

# from scratch: TIDAK memuat bobot task-A
ewc:
  enabled: false
  weight: 0.0

# MULTI-TASK pooled joint (Chaudhry et al. 2019): train = train task-B UNION train task-A,
# satu loader uniform shuffle. Split per dataset lebih dulu, test tak tersentuh.
joint:
  enabled: true
  source: megavul
  ds_name_suffix: ""
  filter_top25_dangerous: true
  max_per_class: 1600
  top_cwe: 0
  resample_seed: 42

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  lm_lr: 1.0e-05
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: true
  use_flash_attention: true
  grad_accum_steps: 1
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 8
  prefetch_factor: 2
