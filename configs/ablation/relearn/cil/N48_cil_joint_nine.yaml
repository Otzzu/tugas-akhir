# CIL UPPER BOUND — Pelatihan ulang gabungan (joint, from scratch), head 36 kelas.
# ewc.enabled false -> TANPA load checkpoint task-A (inisialisasi acak, from scratch).
# replay.buffer_per_class 0 -> buffer = SELURUH split train task-A megavul, jadi tiap step
# melatih 1 batch task-B (megavul_cil, kelas 26..35) + 1 batch task-A (kelas 0..25).
# Split test kedua task identik dengan baris continual (get_splits per --split-seed).
#
# Run: RELEARN_NINE=1 RELEARN_METHODS=joint python scripts/run_relearn_cil_experiment.py --seed N

data:
  source: megavul_cil
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: false
  filter_owasp: false
  max_per_class: 0
  resample_seed: 42
  storage: lazy
  ds_name_suffix: ""

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base-nine
  func_lm: microsoft/unixcoder-base-nine
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: jknet
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 36
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

# from scratch: TIDAK memuat bobot task-A
ewc:
  enabled: false
  weight: 0.0

# buffer_per_class 0 = seluruh train task-A ikut dilatih (joint)
replay:
  enabled: true
  source: megavul
  ds_name_suffix: ""
  buffer_per_class: 0
  weight: 1.0
  buffer_seed: 42
  # task-A megavul subset (overrides cil data block so the buffer uses the trained-on .pt)
  filter_top25_dangerous: true
  max_per_class: 1600
  top_cwe: 0
  resample_seed: 42

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
