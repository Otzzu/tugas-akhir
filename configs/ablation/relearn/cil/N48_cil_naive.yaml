# CIL (class-incremental) task-B = megavul_cil (10 NEW CWE classes, ids 26..35).
# Naive fine-tuning: loads full task-A weights via ewc.source_checkpoint (expandable
# 26→36 head), weight 0 = no EWC penalty. Forgetting baseline for class-incremental.
#
# Requires: data/processed/lm_dataset_megavul_cil_* patched to labels 26..35
# (scripts/patch_cil_labels.py), task-A 26-class ckpt + importance cache present.

data:
  source: megavul_cil
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: false
  filter_owasp: false
  max_per_class: 0
  resample_seed: 42
  storage: lazy
  ds_name_suffix: ""

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: jknet
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 36
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

# weight 0 = naive (load task-A weights via source_checkpoint, no penalty).
ewc:
  enabled: true
  weight: 0.0
  scope: all
  source_checkpoint: checkpoints/n48_taskA/best_model.pt
  importance_cache: checkpoints/n48_taskA/ewc_importance.pt
  n_batches: 0

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
