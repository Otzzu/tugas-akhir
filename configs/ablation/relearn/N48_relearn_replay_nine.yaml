# N48 continual learning (task-B) — Experience Replay only (no EWC penalty).
# ewc.weight: 0 loads the FULL task-A model (via source_checkpoint) with zero regularization,
# while the replay block mixes a per-class memory buffer of task-A (MegaVul) samples into each
# task-B minibatch. Isolates the effect of replay alone vs naive / EWC-DR / EWC-DR+replay.
#
# Prerequisites: CPG built (data/raw/relearn/), task-A checkpoint + importance cache,
# and the task-A (MegaVul vuln-only) .pt for the replay buffer.
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/relearn/N48_relearn_replay.yaml

data:
  source: relearn
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy
  ds_name_suffix: ""

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base-nine
  func_lm: microsoft/unixcoder-base-nine
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: jknet
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

# weight 0 -> load task-A weights, no EWC penalty (replay-only baseline).
ewc:
  enabled: true
  weight: 0.0
  scope: all
  source_checkpoint: checkpoints/n48_taskA/best_model.pt
  importance_cache: checkpoints/n48_taskA/ewc_importance.pt
  n_batches: 0

# Experience replay — task-A memory buffer mixed into task-B minibatches.
replay:
  enabled: true
  source: megavul
  ds_name_suffix: ""
  buffer_per_class: 50
  weight: 1.0
  buffer_seed: 42

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
