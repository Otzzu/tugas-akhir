# N48 continual learning (task-B) — train N48 on the relearn dataset (BigVul + TitanVul,
# vuln-only top-25, deduped vs MegaVul) starting from the MegaVul-trained N48 weights,
# with EWC-DR regularization to resist forgetting MegaVul (task-A).
#
# Label space identical to N48_vulnonly (filter_top25_dangerous => same sorted top-25 CWE
# index mapping), so task-A and task-B share the classification head.
#
# Prerequisites:
#   1. CPG built: scripts/prepare_dataset.py --format relearn (-> data/raw/relearn/)
#   2. task-A checkpoint: best_*.pt from the MegaVul-trained N48 (run 20260617_230612)
#   3. EWC importance cache computed on TASK-A (MegaVul) data, NOT task-B
#      (Fisher must reflect task-A). Point ewc.importance_cache at that file.
#
# Run (cloud, Linux):
#   PYTHONPATH=src python -m gnn_vuln.train --config configs/ablation/relearn/N48_relearn_ewc.yaml

data:
  source: relearn
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: true
  filter_owasp: false
  max_per_class: 1600
  resample_seed: 42
  storage: lazy
  ds_name_suffix: ""

model:
  architecture: lmgat_codebert
  live_lm: none
  pretrained_lm: microsoft/unixcoder-base
  func_lm: microsoft/unixcoder-base
  add_func_tokens: true
  func_max_length: 1024
  localization_encoder: gnn
  graph_pool: jknet
  hidden_dim: 256
  num_layers: 4
  dropout: 0.3
  heads: 4
  edge_dim: 31
  num_classes: 26
  mil_weight: 0.3
  mil_k: 3
  rank_loss_weight: 0.2
  add_self_loops: false
  use_skip: true
  gnn_block_style: gnn_plus
  gnn_norm_type: batch
  gnn_activation: elu
  gnn_use_ffn: true
  gnn_ffn_expansion: 2
  func_head_type: linear

# EWC-DR continual learning — protect task-A (MegaVul) knowledge during task-B training.
# scope: gnn|all  (NOT lm — N48 has no LM branch). source_checkpoint = task-A weights.
# importance_cache = Fisher/theta* precomputed on TASK-A data (see compute step below).
ewc:
  enabled: true
  weight: 1000.0
  scope: all
  source_checkpoint: checkpoints/n48_taskA/best_model.pt
  importance_cache: checkpoints/n48_taskA/ewc_importance.pt
  n_batches: 0

train:
  seed: 42
  epochs: 100
  batch_size: 32
  lr: 0.001
  warmup_ratio: 0.1
  grad_clip: 1.0
  weight_decay: 0.001
  patience: 15
  early_stop_metric: f1
  use_class_weights: true
  focal_loss_gamma: 0.0
  epoch_adaptive_weights: true
  livable_loss: false
  label_smoothing: 0.1
  lr_scheduler: cosine
  device: cuda
  use_amp: false
  use_flash_attention: false
  grad_accum_steps: 2
  save_last_every: 10
  compile_model: false
  stmt_head_vectorized: true
  num_workers: 0
  prefetch_factor: 2
