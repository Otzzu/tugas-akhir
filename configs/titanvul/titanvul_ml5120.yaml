# TitanVul ml5120 — arsitektur hibrida (jalur LM sliding window).
# Sama dengan titanvul_ml1024 kecuali func_max_length. Node feature identik, jadi
# build_pt memakai fast-path re-tokenisasi dari base ml1024.
#
# Build:
#   uv run python -m gnn_vuln.data.build_pt --config configs/titanvul/titanvul_ml5120.yaml

data:
  source: titanvul
  mode: multiclass
  max_nodes: 2500
  top_cwe: 0
  filter_top25_dangerous: false
  filter_owasp: false
  max_per_class: 0
  resample_seed: 42
  storage: lazy

model:
  architecture: lmgat_codebert
  pretrained_lm: microsoft/unixcoder-base-nine
  func_lm: microsoft/unixcoder-base-nine
  add_func_tokens: true
  func_max_length: 5120
  num_classes: 26

train:
  seed: 42
